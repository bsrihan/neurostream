[package]
name = "neurostream"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Millisecond neural signal pipeline in Rust: re-reference, 250-5000 Hz acausal filter, spikes, spike-band power"
license = "MIT"
publish = false

[lib]
name = "neurostream"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "neurostream-bench"
path = "src/bin/bench.rs"

[dependencies]
matrixmultiply = "0.3"
num-complex = "0.4"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py310"], optional = true }
numpy = { version = "0.25", optional = true }

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
