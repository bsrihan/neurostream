[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "neurostream"
version = "0.1.0"
description = "Rust millisecond neural pipeline with Python bindings"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.maturin]
features = ["pyo3/extension-module", "python"]
module-name = "neurostream"
